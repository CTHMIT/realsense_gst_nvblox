[project]
name = "gst_realsense_launch"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "cthsu", email = "chuntsehsu@gmail.com"},
]

dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pyrealsense2>=2.56.5.9235",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "setuptools>=80.9.0",
]

requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "black>=25.9.0",
    "isort>=6.1.0",
    "flake8>=7.0.0",
    "bandit>=1.8.6",
    "mypy>=1.18.2",
    "types-PyYAML>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
    "ruff>=0.6.9",
    "yamllint>=1.37.1",
    "pydocstyle>=6.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
# Launch scripts
sender = {call = "gst_realsense_launch.gst_sender:main"}
receiver = {call = "gst_realsense_launch.gst_receiver:main"}
parser = {call = "gst_realsense_launch.rs_camera_info_parser:main"}

# Development tools
lint = "pre-commit run --all-files"
format = {composite = ["black .", "isort ."]}
type-check = "mypy gst_realsense_launch/ scripts/"
test = "pytest test/ -v"
test-cov = "pytest test/ --cov=gst_realsense_launch --cov-report=html"

# Installation
install-deps = "bash scripts/apt_install.sh"

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | install
  | log
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
extend_skip = [".venv", "build", "dist", "install"]

# Ruff configuration
[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "install",
    "log",
    "__pycache__",
    "migrations"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "ARG001",  # Unused function argument
]

[tool.ruff.lint.per-file-ignores]
"src/gst_realsense_launch/__init__.py" = ["F401", "D104"]
"src/gst_realsense_launch/gst_sender.py" = ["ARG001"]
"src/gst_realsense_launch/gst_receiver.py" = ["ARG001"]
"src/launch/*.py" = ["D100", "D103"]


# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "install", "log"]
skips = ["B101", "B601"]  # Skip assert warnings and shell injection in specific cases

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    'build/',
    'dist/',
    'install/',
    'log/',
    '.venv/',
]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
[tool.coverage.run]
source = ["gst_realsense_launch", "launch"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Pydocstyle configuration
[tool.pydocstyle]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "D205", "D212", "D415"]

# MyPy ignore patterns
[[tool.mypy.overrides]]
module = [
    "launch.*",
    "sensor_msgs.*",
    "geometry_msgs.*",
    "tf2_ros.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gst_realsense_launch.gst_sender"
disable_error_code = ["attr-defined", "name-defined", "no-any-return"]

[dependency-groups]
lint = [
    "pre-commit>=4.3.0",
]
